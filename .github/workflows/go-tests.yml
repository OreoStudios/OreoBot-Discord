name: Go checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting for changed Go files
        run: |
          files=$(gofmt -l modules/tickets/infrastructure/discord/tickets.go modules/tickets/infrastructure/discord/ticket_overflow.go modules/tickets/infrastructure/discord/ticket_overflow_test.go modules/config/config.go)
          if [ -n "$files" ]; then
            echo "Go files need formatting:"
            echo "$files"
            exit 1
          fi

      - name: Run unit and architecture tests
        run: go test ./...
